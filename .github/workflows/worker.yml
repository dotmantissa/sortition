name: Settlement worker
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: settlement-worker
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process durable settlement jobs
        env:
          SORTITION_URL: https://sortition.vercel.app
          WORKER_SECRET: ${{ secrets.SORTITION_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "The worker secret has not been configured."
            exit 1
          fi
          for round in 1 2 3 4; do
            curl --fail --silent --show-error --max-time 60 \
              -X POST -H "Authorization: Bearer $WORKER_SECRET" \
              "$SORTITION_URL/api/worker"
            sleep 10
          done
